version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ../storage:/app/storage
    env_file:
      - ../.env
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    volumes:
      - ../storage:/app/storage
    env_file:
      - ../.env
    restart: unless-stopped
